name: Temporary REG-027 Prettier normalization

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation
          fetch-depth: 0

      - name: Restore reviewed logic and format one file
        run: |
          git show e26efcc58a2a78a9057fdaf8fc46c04429ff304f:tests/platform/authorization-tenant-foundation.test.mjs > tests/platform/authorization-tenant-foundation.test.mjs
          npx --yes prettier@3.6.2 --write tests/platform/authorization-tenant-foundation.test.mjs
          git diff --check -- tests/platform/authorization-tenant-foundation.test.mjs

      - name: Commit normalized file if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authorization-tenant-foundation.test.mjs
          if git diff --cached --quiet; then
            echo "Authorization migration test is already normalized."
            exit 0
          fi
          git commit -m "Normalize future-safe authorization migration proof"
          git push origin HEAD:build/m1-05-email-delivery-foundation
