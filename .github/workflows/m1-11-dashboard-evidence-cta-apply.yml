name: M1.11 dashboard evidence CTA apply

on:
  push:
    branches:
      - build/m1-11-worker-evidence-records
    paths:
      - .github/workflows/m1-11-dashboard-evidence-cta-apply.yml
      - scripts/m1-11-dashboard-evidence-cta-patch.py

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: build/m1-11-worker-evidence-records
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/m1-11-dashboard-evidence-cta-patch.py
      - run: node scripts/check-worker-evidence-records.mjs
      - run: node scripts/run-worker-evidence-record-tests.mjs
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit verified dashboard CTA and remove helper
        run: |
          rm scripts/m1-11-dashboard-evidence-cta-patch.py
          rm .github/workflows/m1-11-dashboard-evidence-cta-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/worker/(portal)/dashboard/page.tsx scripts/m1-11-dashboard-evidence-cta-patch.py .github/workflows/m1-11-dashboard-evidence-cta-apply.yml
          git commit -m "feat: link Worker dashboard to evidence workspace"
          git push origin HEAD:build/m1-11-worker-evidence-records
