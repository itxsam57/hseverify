name: M1.10 expiry lifecycle one-shot

on:
  push:
    branches:
      - build/m1-10-worker-invitations-company-codes

permissions:
  contents: write

concurrency:
  group: m1-10-expiry-lifecycle-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Add durable expiry sweep
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/company/company-workforce-service.ts';
          let source = fs.readFileSync(path, 'utf8');
          if (source.includes('export async function expireCompanyWorkforceResources(')) process.exit(0);
          const insertion = `export async function expireCompanyWorkforceResources(
            database: DatabaseClient,
            tenantId: string,
            now: Date
          ): Promise<void> {
            const nowIso = now.toISOString();
            await database.query(
              \`UPDATE company_worker_invitations
               SET invitation_status='expired', expired_at=$2, updated_at=$2
               WHERE tenant_id=$1
                 AND invitation_status='pending'
                 AND expires_at <= $2::timestamptz\`,
              [tenantId, nowIso]
            );
            await database.query(
              \`UPDATE company_registration_codes
               SET code_status='expired', expired_at=$2, updated_at=$2
               WHERE tenant_id=$1
                 AND code_status='active'
                 AND expires_at <= $2::timestamptz\`,
              [tenantId, nowIso]
            );
          }

          `;
          const marker = 'export async function runVerifiedCompanyWorkforceCommand<Result>(input: {';
          if (!source.includes(marker)) throw new Error('M1.10 expiry insertion socket changed.');
          source = source.replace(marker, insertion + marker);
          const opMarker = '      await assertVerifiedCompany(database, scope.tenantId);\n      return input.operation({ database, tenantId: scope.tenantId, membershipId: scope.membershipId });';
          if (!source.includes(opMarker)) throw new Error('M1.10 verified command expiry socket changed.');
          source = source.replace(
            opMarker,
            '      await assertVerifiedCompany(database, scope.tenantId);\n      await expireCompanyWorkforceResources(database, scope.tenantId, input.now ?? new Date());\n      return input.operation({ database, tenantId: scope.tenantId, membershipId: scope.membershipId });'
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Verify expiry and complete M1.10 contract
        run: |
          git diff --check
          npm run check:m1-10
          npm run test:m1-10
          npm run test:m1-09
          npm run test:auth-platform
      - name: Commit exact expiry fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company/company-workforce-service.ts
          git commit -m 'fix: expire stale Company workforce resources'
          git push origin HEAD:build/m1-10-worker-invitations-company-codes
