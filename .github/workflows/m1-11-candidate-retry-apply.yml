name: M1.11 candidate retry apply

on:
  push:
    branches:
      - build/m1-11-worker-evidence-records
    paths:
      - .github/workflows/m1-11-candidate-retry-apply.yml
      - scripts/m1-11-candidate-retry-patch.py

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: build/m1-11-worker-evidence-records
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/m1-11-candidate-retry-patch.py
      - run: node scripts/check-worker-evidence-records.mjs
      - run: node scripts/run-worker-evidence-record-tests.mjs
      - run: npm run test:m1-10
      - run: npm run typecheck
      - name: Commit verified retry fix and remove helper
        run: |
          rm scripts/m1-11-candidate-retry-patch.py
          rm .github/workflows/m1-11-candidate-retry-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/0030_worker_evidence_records.up.sql scripts/m1-11-candidate-retry-patch.py .github/workflows/m1-11-candidate-retry-apply.yml
          git commit -m "fix: keep failed M1.11 scan retries unblocked"
          git push origin HEAD:build/m1-11-worker-evidence-records
