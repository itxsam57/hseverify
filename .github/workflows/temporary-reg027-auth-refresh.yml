name: Temporary REG-027 auth migration refresh

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  refresh-auth-migration-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation

      - name: Apply exact future-safe migration-test transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/platform/authentication-foundation.test.mjs")
          text = path.read_text()

          old_import = '''import {
            applyPendingMigrations,
            migrationStatus,
            rollbackLatestMigration
          } from "../../scripts/lib/migrations.mjs";'''
          new_import = '''import {
            applyPendingMigrations,
            listMigrations,
            migrationStatus,
            rollbackLatestMigration
          } from "../../scripts/lib/migrations.mjs";'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("expected migration import block not found")

          old_status = '''    const status = await migrationStatus(database);
              assert.deepEqual(
                status.map((entry) => [entry.id, entry.applied, entry.checksumMatches]),
                [
                  ["0001_platform_foundation", true, true],
                  ["0002_authentication_foundation", true, true],
                  ["0003_worker_registration_otp", true, true],
                  ["0004_authentication_completion", true, true],
                  ["0005_authorization_tenant_isolation", true, true],
                  ["0006_authorization_tenant_scope_fixture", true, true],
                  ["0007_platform_audit_foundation", true, true],
                  ["0008_transactional_outbox_jobs", true, true],
                  ["0009_persisted_notifications", true, true]
                ]
              );'''
          new_status = '''    const status = await migrationStatus(database);
              const expectedMigrationIds = (await listMigrations()).map(
                (migration) => migration.id
              );
              assert.deepEqual(status.map((entry) => entry.id), expectedMigrationIds);
              assert.equal(status.every((entry) => entry.applied), true);
              assert.equal(status.every((entry) => entry.checksumMatches), true);'''
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit("expected hard-coded status block not found")

          anchor = '''  try {
              const notificationRollback = await rollbackLatestMigration(
                database,
                TEST_ENVIRONMENT
              );'''
          replacement = '''  try {
              const migrationIds = (await listMigrations()).map(
                (migration) => migration.id
              );
              const notificationIndex = migrationIds.indexOf(
                "0009_persisted_notifications"
              );
              assert.ok(notificationIndex >= 0);
              for (const newerMigration of migrationIds
                .slice(notificationIndex + 1)
                .reverse()) {
                const newerRollback = await rollbackLatestMigration(
                  database,
                  TEST_ENVIRONMENT
                );
                assert.equal(newerRollback, newerMigration);
              }

              const notificationRollback = await rollbackLatestMigration(
                database,
                TEST_ENVIRONMENT
              );'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif replacement not in text:
              raise SystemExit("expected auth rollback anchor not found")

          old_reapply = '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            assert.deepEqual(reapplied, [
              "0002_authentication_foundation",
              "0003_worker_registration_otp",
              "0004_authentication_completion",
              "0005_authorization_tenant_isolation",
              "0006_authorization_tenant_scope_fixture",
              "0007_platform_audit_foundation",
              "0008_transactional_outbox_jobs",
              "0009_persisted_notifications"
            ]);'''
          new_reapply = '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            const expectedReapply = (await listMigrations())
              .map((migration) => migration.id)
              .slice(1);
            assert.deepEqual(reapplied, expectedReapply);'''
          if old_reapply in text:
              text = text.replace(old_reapply, new_reapply, 1)
          elif new_reapply not in text:
              raise SystemExit("expected auth reapply block not found")

          path.write_text(text)

      - name: Commit exact test change when needed
        run: |
          if git diff --quiet -- tests/platform/authentication-foundation.test.mjs; then
            echo "Authentication migration test is already future-safe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authentication-foundation.test.mjs
          git commit -m "Make authentication migration proof future-safe"
          git push origin HEAD:build/m1-05-email-delivery-foundation
