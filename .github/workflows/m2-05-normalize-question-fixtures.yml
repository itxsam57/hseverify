name: M2.05 normalize Question Bank fixtures

on:
  push:
    branches: [feat/m2-05-randomized-assessment-forms]
    paths:
      - ".github/workflows/m2-05-normalize-question-fixtures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2-05-randomized-assessment-forms
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Make runtime fixtures follow the production Question Bank transaction order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          generation = Path('tests/platform/randomized-assessment-form-runtime.test.mjs')
          text = generation.read_text()
          pattern = re.compile(r"async function seedQuestion\(database, frameworkId, c\) \{.*?\n\}\n\nasync function reviseQuestion", re.S)
          replacement = '''async function seedQuestion(database, frameworkId, c) {
            const questionId = oid("assessment_question", c);
            const questionVersionId = oid("question_version", c);
            const hash = fingerprint(`question-${c}-v1`);
            await database.query(
              `INSERT INTO assessment_questions(
                 question_id,question_reference,question_status,
                 created_by_account_id,created_at,updated_at
               ) VALUES($1,$2,'INACTIVE',$3,$4,$4)`,
              [questionId, `GEN-Q-${c}`, `account_seed_${c}`, NOW]
            );
            await database.query(
              `INSERT INTO assessment_question_versions(
                 question_version_id,question_id,version_no,question_type,prompt,options_json,
                 answer_key_json,rubric_json,framework_id,domain_reference,difficulty,tags_json,
                 content_fingerprint,created_by_account_id,created_at
               ) VALUES($1,$2,1,'MULTIPLE_CHOICE',$3,$4::jsonb,$5::jsonb,NULL,$6,
                        'General Safety','MEDIUM',$7::jsonb,$8,$9,$10)`,
              [
                questionVersionId,
                questionId,
                `What is the safe response for generated question ${c}?`,
                JSON.stringify(["Stop work", "Continue", "Ignore"]),
                JSON.stringify("Stop work"),
                frameworkId,
                JSON.stringify(["core"]),
                hash,
                `account_seed_${c}`,
                NOW
              ]
            );
            await database.query(
              `UPDATE assessment_questions
               SET current_version_id=$2,current_content_fingerprint=$3,
                   question_status='ACTIVE',updated_at=$4
               WHERE question_id=$1`,
              [questionId, questionVersionId, hash, NOW]
            );
            return { questionId, questionVersionId };
          }

          async function reviseQuestion'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Expected exactly one generation seedQuestion function, found {count}.')
          generation.write_text(text)

          delivery = Path('tests/platform/assessment-form-delivery.test.mjs')
          text = delivery.read_text()
          old_mcq = '''  await database.query(
            `INSERT INTO assessment_questions(
               question_id,question_reference,question_status,current_version_id,
               current_content_fingerprint,created_by_account_id,created_at,updated_at
             ) VALUES($1,'DELIVERY-MCQ','ACTIVE',$2,$3,$4,$5,$5)`,
            [mcqQuestionId, mcqV1, mcqHashV1, "account_delivery_seed", NOW]
          );'''
          new_mcq = '''  await database.query(
            `INSERT INTO assessment_questions(
               question_id,question_reference,question_status,
               created_by_account_id,created_at,updated_at
             ) VALUES($1,'DELIVERY-MCQ','INACTIVE',$2,$3,$3)`,
            [mcqQuestionId, "account_delivery_seed", NOW]
          );'''
          if text.count(old_mcq) != 1:
            raise SystemExit(f'Expected one MCQ stable seed, found {text.count(old_mcq)}.')
          text = text.replace(old_mcq, new_mcq, 1)

          mcq_anchor = '''  const writtenQuestionId = oid("assessment_question", "w");'''
          mcq_update = '''  await database.query(
            `UPDATE assessment_questions
             SET current_version_id=$2,current_content_fingerprint=$3,
                 question_status='ACTIVE',updated_at=$4
             WHERE question_id=$1`,
            [mcqQuestionId, mcqV1, mcqHashV1, NOW]
          );

          const writtenQuestionId = oid("assessment_question", "w");'''
          if text.count(mcq_anchor) != 1:
            raise SystemExit('Expected one written-question anchor.')
          text = text.replace(mcq_anchor, mcq_update, 1)

          old_written = '''  await database.query(
            `INSERT INTO assessment_questions(
               question_id,question_reference,question_status,current_version_id,
               current_content_fingerprint,created_by_account_id,created_at,updated_at
             ) VALUES($1,'DELIVERY-WRITTEN','ACTIVE',$2,$3,$4,$5,$5)`,
            [writtenQuestionId, writtenV1, writtenHash, "account_delivery_seed", NOW]
          );'''
          new_written = '''  await database.query(
            `INSERT INTO assessment_questions(
               question_id,question_reference,question_status,
               created_by_account_id,created_at,updated_at
             ) VALUES($1,'DELIVERY-WRITTEN','INACTIVE',$2,$3,$3)`,
            [writtenQuestionId, "account_delivery_seed", NOW]
          );'''
          if text.count(old_written) != 1:
            raise SystemExit(f'Expected one written stable seed, found {text.count(old_written)}.')
          text = text.replace(old_written, new_written, 1)

          form_anchor = '''  await database.transaction(async (transaction) => {'''
          written_update = '''  await database.query(
            `UPDATE assessment_questions
             SET current_version_id=$2,current_content_fingerprint=$3,
                 question_status='ACTIVE',updated_at=$4
             WHERE question_id=$1`,
            [writtenQuestionId, writtenV1, writtenHash, NOW]
          );

          await database.transaction(async (transaction) => {'''
          if text.count(form_anchor) != 1:
            raise SystemExit(f'Expected one delivery form transaction anchor, found {text.count(form_anchor)}.')
          text = text.replace(form_anchor, written_update, 1)
          delivery.write_text(text)
          PY
      - name: Prove all M2.05 behavioral suites under the stronger FK
        run: node scripts/run-assessment-generation-tests.mjs
      - name: Strict TypeScript and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Commit verified fixture normalization
        run: |
          git config user.name "hseverify-m205-bot"
          git config user.email "hseverify-m205-bot@users.noreply.github.com"
          git add tests/platform/randomized-assessment-form-runtime.test.mjs tests/platform/assessment-form-delivery.test.mjs
          git rm .github/workflows/m2-05-normalize-question-fixtures.yml
          git diff --cached --check
          git commit -m "test(m2.05): align question fixtures with identity constraints"
          git push origin HEAD:feat/m2-05-randomized-assessment-forms
