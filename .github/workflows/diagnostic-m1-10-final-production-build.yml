name: Diagnostic M1.10 final production build

on:
  push:
    branches:
      - diagnostic/m1-10-final-production-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: ci-auth-pepper-with-at-least-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: false
      HSE_ENABLE_WORKER_DEMO_AUTH: false
      HSE_USE_WORKER_DEMO_DATA: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
