name: Diagnostic M1.10 full check isolation

on:
  push:
    branches:
      - diagnostic/m1-10-full-check-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFIED_SHA: ${{ github.sha }}
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: ci-auth-pepper-with-at-least-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"
      HANDOFF_REQUEST: Diagnostic M1.10 full check isolation

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: 01 Source and architecture guards
        run: >-
          npm run validate:env &&
          npm run check:engineering &&
          npm run check:routes &&
          npm run check:authorization &&
          npm run check:tenant-scope &&
          npm run check:company-scope &&
          npm run check:audit &&
          npm run check:outbox &&
          npm run check:notifications &&
          npm run check:email-delivery &&
          npm run check:m1-05-final &&
          npm run check:secure-files &&
          npm run check:secure-upload &&
          npm run check:secure-scan &&
          npm run check:secure-access &&
          npm run check:m1-06-final &&
          npm run check:worker-identity &&
          npm run check:worker-identity-draft &&
          npm run check:worker-identity-evidence &&
          npm run check:worker-identity-automated-checks &&
          npm run check:worker-identity-eligibility &&
          npm run check:worker-identity-corrections &&
          npm run check:company-verification &&
          npm run check:m1-09 &&
          npm run check:m1-10 &&
          npm run check:design-system &&
          npm run check:ux &&
          npm run check:dependencies &&
          npm run audit:production

      - name: 02 Unit/service harnesses
        if: always()
        run: >-
          npm run test:engineering &&
          npm run test:profile &&
          npm run test:auth &&
          npm run test:authorization &&
          npm run test:audit &&
          npm run test:outbox &&
          npm run test:notifications &&
          npm run test:email-delivery &&
          npm run test:secure-files &&
          npm run test:secure-upload &&
          npm run test:secure-scan &&
          npm run test:secure-access

      - name: 03 Platform and authentication foundations
        if: always()
        run: npm run test:platform && npm run test:auth-platform

      - name: 04 Authorization and M1.04 isolation
        if: always()
        run: >-
          npm run test:authorization-platform &&
          npm run test:tenant-scope &&
          npm run test:company-scope &&
          npm run test:m1-04-final

      - name: 05 Audit outbox notifications email M1.05
        if: always()
        run: >-
          npm run test:audit-platform &&
          npm run test:outbox-platform &&
          npm run test:notification-platform &&
          npm run test:email-delivery-platform &&
          npm run test:email-delivery-runtime &&
          npm run test:m1-05-final

      - name: 06 Secure files M1.06
        if: always()
        run: >-
          npm run test:secure-files-platform &&
          npm run test:secure-upload-platform &&
          npm run test:secure-upload-runtime &&
          npm run test:secure-scan-platform &&
          npm run test:secure-scan-runtime &&
          npm run test:secure-scan-handler-runtime &&
          npm run test:secure-access-runtime &&
          npm run test:m1-06-final

      - name: 07 Worker identity M1.07
        if: always()
        run: >-
          npm run test:worker-identity &&
          npm run test:worker-identity-draft &&
          npm run test:worker-identity-evidence &&
          npm run test:worker-identity-automated-checks &&
          npm run test:worker-identity-eligibility &&
          npm run test:worker-identity-corrections &&
          npm run test:m1-07-final

      - name: 08 Company M1.08 M1.09 M1.10
        if: always()
        run: >-
          npm run test:m1-08-final &&
          npm run test:m1-09 &&
          npm run test:m1-10

      - name: 09 Registration and auth completion
        if: always()
        run: >-
          npm run test:registration-platform &&
          npm run test:registration-owner-repair &&
          npm run test:auth-completion

      - name: 10 Static project quality
        if: always()
        run: >-
          npm run test:profile-overflow &&
          npm run test:preview-copy &&
          npm run test:next-system &&
          npm run typecheck &&
          npm run lint

      - name: 11 Runtime smoke and production build
        if: always()
        run: >-
          npm run test:development &&
          npm run test:portal-redirects &&
          npm run test:runtime-db &&
          npm run build
