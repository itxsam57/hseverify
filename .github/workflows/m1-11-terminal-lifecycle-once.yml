name: M1.11 terminal lifecycle once

on:
  push:
    branches:
      - build/m1-11-worker-evidence-records

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Add terminal lifecycle guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/worker-evidence/worker-evidence-repository.ts')
          text = path.read_text(encoding='utf-8')
          methods = ['startRevision', 'endEmployment', 'markSkillInactive']
          old = '''      if (current.status !== "submitted" || current.revision !== input.expectedRevision) {
          throw new WorkerEvidenceConflictError();
        }'''
          new = '''      if (
          current.lifecycleStatus !== "active" ||
          current.status !== "submitted" ||
          current.revision !== input.expectedRevision
        ) {
          throw new WorkerEvidenceConflictError();
        }'''

          for method in methods:
              start = text.find(f'  async {method}(')
              if start < 0:
                  raise SystemExit(f'{method}: method not found')
              next_method = text.find('\n  async ', start + 1)
              end = len(text) if next_method < 0 else next_method
              block = text[start:end]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'{method}: expected one lifecycle condition, found {count}')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify terminal lifecycle and M1.11 contracts
        run: |
          node scripts/check-worker-evidence-records.mjs
          node scripts/run-worker-evidence-record-tests.mjs
          npm run typecheck
      - name: Commit verified repository guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/worker-evidence/worker-evidence-repository.ts
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: enforce terminal Worker evidence lifecycle"
          git push origin HEAD:build/m1-11-worker-evidence-records
