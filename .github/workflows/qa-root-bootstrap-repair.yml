name: QA Browser Harness Wait Repair

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - ".github/workflows/qa-root-bootstrap-repair.yml"

permissions:
  contents: write

jobs:
  patch-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/hard-browser-m2-02-m2-06
          fetch-depth: 0

      - name: Apply exact Playwright navigation-wait repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/hard-browser-qa.mjs')
          text = path.read_text()
          old = '''  await page.getByRole("button", { name: "Sign in" }).click();
            await page.waitForURL(new RegExp(`/${role}/`), { timeout: 15_000 });
            assert(!page.url().includes("/login"), `${role} remained on login after valid credentials`);
          '''
          new = '''  await page.getByRole("button", { name: "Sign in" }).click();
            await page.waitForURL(
              (url) => url.pathname.startsWith(`/${role}/`) && url.pathname !== `/${role}/login`,
              { timeout: 15_000 }
            );
            assert(!page.url().includes("/login"), `${role} remained on login after valid credentials`);
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale login wait block, found {text.count(old)}; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/hard-browser-qa.mjs
          git diff --check

      - name: Commit harness fix and remove obsolete one-shot workflow
        run: |
          git config user.name "hseverify-qa-bot"
          git config user.email "hseverify-qa-bot@users.noreply.github.com"
          rm .github/workflows/qa-root-bootstrap-repair.yml
          git add scripts/hard-browser-qa.mjs .github/workflows/qa-root-bootstrap-repair.yml
          git diff --cached --check
          git commit -m "test(browser): wait for portal navigation after staff sign-in"
          git push origin HEAD:qa/hard-browser-m2-02-m2-06
