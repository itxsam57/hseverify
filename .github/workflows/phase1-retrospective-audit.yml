name: Phase 1 retrospective audit

on:
  push:
    branches: [feat/m2-06-assessment-catalogue-eligibility]
    paths:
      - "scripts/hard-browser-retrospective.mjs"
      - "scripts/hard-browser-retrospective-worker-evidence.mjs"
      - "tests/platform/hard-browser-audit-contract.test.mjs"
      - "tests/platform/phase1-retrospective-performance.test.mjs"
      - "scripts/run-phase1-retrospective-performance.mjs"
      - ".github/workflows/phase1-retrospective-audit.yml"
      - "src/**"
      - "database/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/hard-browser-retrospective.mjs"
      - "scripts/hard-browser-retrospective-worker-evidence.mjs"
      - "tests/platform/hard-browser-audit-contract.test.mjs"
      - "tests/platform/phase1-retrospective-performance.test.mjs"
      - "scripts/run-phase1-retrospective-performance.mjs"
      - ".github/workflows/phase1-retrospective-audit.yml"
      - "src/**"
      - "database/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Completed-workflow browser coverage contract
        run: node --test tests/platform/hard-browser-audit-contract.test.mjs

  retrospective-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HSE_APP_ENV: test
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: /tmp/hseverify-retrospective-browser-db
      HSE_SESSION_SECRET: retrospective-browser-session-secret-2026-at-least-32-characters
      HSE_AUTH_PEPPER: retrospective-browser-auth-pepper-2026-at-least-32-characters
      HSE_ENABLE_AUTH_SANDBOX: "true"
      HSE_AUTH_SANDBOX_ACCESS_KEY: retrospective-browser-sandbox-key-2026
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"
      HSE_RELEASE_SHA: phase1-retrospective-browser
      HSE_BROWSER_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migrate clean retrospective browser database
        run: npm run db:migrate
      - name: Assert clean bootstrap database
        run: node scripts/hard-browser-zero-state.mjs
      - name: Install pinned Playwright without lockfile changes
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start real Next.js application
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/hse-retrospective-browser-server.log 2>&1 &
          echo $! > /tmp/hse-retrospective-browser-server.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/hse-retrospective-browser-server.pid)" 2>/dev/null; then
              cat /tmp/hse-retrospective-browser-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/hse-retrospective-browser-server.log
          exit 1
      - name: Run Worker registration/profile/identity retrospective Chromium
        run: node scripts/hard-browser-retrospective.mjs
      - name: Run Worker secure evidence/history retrospective Chromium
        run: node scripts/hard-browser-retrospective-worker-evidence.mjs
      - name: Typecheck after retrospective browser exercise
        if: success()
        run: npm run typecheck
      - name: Lint after retrospective browser exercise
        if: success()
        run: npm run lint
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/hard-browser-retrospective
          cp /tmp/hse-retrospective-browser-server.log artifacts/hard-browser-retrospective/server.log || true
      - name: Upload retrospective browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-retrospective-browser-${{ github.sha }}
          path: |
            artifacts/hard-browser-retrospective
            artifacts/hard-browser-retrospective-evidence
          if-no-files-found: warn
          retention-days: 14
