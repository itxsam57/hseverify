name: M1.10 prepared invitation hook one-shot

on:
  push:
    branches:
      - build/m1-10-worker-invitations-company-codes

permissions:
  contents: write

concurrency:
  group: m1-10-prepared-invitation-hook-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add resource-only existing Worker invitation completion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/company/company-workforce-registration-service.ts';
          let source = fs.readFileSync(path, 'utf8');
          const needle = '  private async completeInvitation(\n';
          if (!source.includes(needle)) throw new Error('M1.10 prepared invitation insertion socket changed.');
          const addition = `  async completePreparedInvitation(
            principal: AuthorizationPrincipal,
            resourceId: string
          ): Promise<CompanyWorkerLinkRecord> {
            const invitationId = resourceId.trim();
            if (!invitationId) throw new CompanyWorkforceAccessError();
            const now = this.now();
            return this.database.transaction(async (database) => {
              const worker = await liveWorker(database, principal, now);
              return this.completeInvitation(
                database,
                principal,
                worker,
                invitationId,
                now
              );
            });
          }

          `;
          source = source.replace(needle, addition + needle);
          fs.writeFileSync(path, source);
          NODE
      - name: Verify M1.10 runtime after prepared invitation hook
        run: node scripts/run-company-worker-invitation-tests.mjs
      - name: Commit exact hook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company/company-workforce-registration-service.ts
          git commit -m 'feat: complete prepared Worker invitation after sign-in'
          git push origin HEAD:build/m1-10-worker-invitations-company-codes
