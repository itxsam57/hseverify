name: Temporary Subunit 4 idempotency hardening

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation

      - name: Apply exact hardening transforms
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"{label}: expected source not found")
              p.write_text(text.replace(old, new, 1))

          # Repair formatting left by the safe authentication migration transform.
          replace_once(
              "tests/platform/authentication-foundation.test.mjs",
              '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            const expectedReapply = (await listMigrations())
              .map((migration) => migration.id)
              .slice(1);
            assert.deepEqual(reapplied, expectedReapply);''',
              '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            const expectedReapply = (await listMigrations())
              .map((migration) => migration.id)
              .slice(1);
            assert.deepEqual(reapplied, expectedReapply);''',
              "auth-format"
          )
          # The replacement above is idempotent but Python triple-string indentation is
          # stripped by YAML; normalize with a direct line-oriented correction below.
          auth_path = Path("tests/platform/authentication-foundation.test.mjs")
          auth = auth_path.read_text()
          auth = auth.replace(
              '''    const reapplied = await applyPendingMigrations(
            database,
            TEST_ENVIRONMENT.releaseSha
          );
          const expectedReapply = (await listMigrations())
            .map((migration) => migration.id)
            .slice(1);
          assert.deepEqual(reapplied, expectedReapply);''',
              '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            const expectedReapply = (await listMigrations())
              .map((migration) => migration.id)
              .slice(1);
            assert.deepEqual(reapplied, expectedReapply);'''
          )
          auth_path.write_text(auth)

          replace_once(
              "src/lib/email-delivery/email-delivery-domain.ts",
              '''export type PreparedEmailDeliveryAttempt = Readonly<{
            delivery: EmailDeliveryRecord;
            attempt: EmailDeliveryAttemptRecord;
            recipientAddress: string;
          }>;''',
              '''export type EmailDeliveryAttemptPreparation =
            | Readonly<{
                kind: "already_delivered";
                delivery: EmailDeliveryRecord;
              }>
            | Readonly<{
                kind: "already_terminal";
                delivery: EmailDeliveryRecord;
              }>
            | Readonly<{
                kind: "attempt";
                created: boolean;
                delivery: EmailDeliveryRecord;
                attempt: EmailDeliveryAttemptRecord;
                recipientAddress: string;
              }>;''',
              "domain-preparation-union"
          )

          repository_path = Path("src/lib/email-delivery/email-delivery-repository.ts")
          repository = repository_path.read_text()
          repository = repository.replace(
              '  type PreparedEmailDeliveryAttempt\n} from "./email-delivery-domain";',
              '  type EmailDeliveryAttemptPreparation\n} from "./email-delivery-domain";',
              1
          )
          repository = repository.replace(
              '  ): Promise<PreparedEmailDeliveryAttempt>;',
              '  ): Promise<EmailDeliveryAttemptPreparation>;',
              1
          )

          begin_pattern = re.compile(
              r'''  async beginAttemptInTransaction\(\n.*?\n  async finalizeAttemptInTransaction\(''',
              re.S,
          )
          begin_replacement = '''  async beginAttemptInTransaction(
            database: DatabaseClient,
            jobInput: OutboxJobRecord,
            leaseInput: TrustedOutboxLease,
            adapterKey: EmailAdapterKey
          ): Promise<EmailDeliveryAttemptPreparation> {
            const job = assertEmailDeliveryJob(jobInput);
            const lease = assertTrustedOutboxLease(leaseInput);
            if (lease.jobId !== job.jobId || !isEmailAdapterKey(adapterKey)) {
              throw new StaleOutboxLeaseError();
            }

            const deliveryResult = await database.query<DeliveryRow>(EMAIL_FIND_BY_JOB_SQL, [
              job.jobId
            ]);
            let delivery = deliveryResult.rows[0]
              ? deliveryFromRow(deliveryResult.rows[0])
              : null;
            if (!delivery) {
              throw new EmailDeliveryContractError(
                "Email delivery record is missing for the claimed outbox job."
              );
            }

            if (delivery.status === "delivered") {
              return Object.freeze({ kind: "already_delivered" as const, delivery });
            }
            if (delivery.status === "terminal_failed") {
              return Object.freeze({ kind: "already_terminal" as const, delivery });
            }

            const expired = await database.query<EmailAttemptRow>(
              EMAIL_RECONCILE_EXPIRED_ATTEMPTS_SQL,
              [delivery.deliveryId]
            );
            if (expired.rows.length > 0 && delivery.status === "processing") {
              const reconciled = await database.query<DeliveryRow>(
                EMAIL_RECONCILE_DELIVERY_SQL,
                [delivery.deliveryId]
              );
              if (reconciled.rows[0]) delivery = deliveryFromRow(reconciled.rows[0]);
            }

            if (delivery.status === "delivered") {
              return Object.freeze({ kind: "already_delivered" as const, delivery });
            }
            if (delivery.status === "terminal_failed") {
              return Object.freeze({ kind: "already_terminal" as const, delivery });
            }

            const dispatchKey = deriveEmailDispatchKey(delivery.deliveryId, lease);
            const inserted = await database.query<EmailAttemptRow>(EMAIL_INSERT_ATTEMPT_SQL, [
              createEmailAttemptId(),
              job.jobId,
              lease.attemptId,
              lease.attemptNumber,
              lease.workerId,
              lease.leaseId,
              adapterKey,
              dispatchKey
            ]);
            const created = Boolean(inserted.rows[0]);
            let attemptRow = inserted.rows[0];
            if (!attemptRow) {
              const existing = await database.query<EmailAttemptRow>(
                EMAIL_FIND_ATTEMPT_BY_OUTBOX_ATTEMPT_SQL,
                [lease.attemptId]
              );
              attemptRow = existing.rows[0];
              if (!attemptRow) throw new StaleOutboxLeaseError();
            }
            const attempt = attemptFromRow(attemptRow);
            if (
              attempt.deliveryId !== delivery.deliveryId ||
              attempt.sourceJobId !== job.jobId ||
              attempt.attemptNumber !== lease.attemptNumber ||
              attempt.workerId !== lease.workerId ||
              attempt.leaseId !== lease.leaseId ||
              attempt.adapterKey !== adapterKey ||
              attempt.dispatchKey !== dispatchKey
            ) {
              throw new StaleOutboxLeaseError();
            }

            if (created) {
              const processing = await database.query<DeliveryRow>(
                EMAIL_MARK_PROCESSING_SQL,
                [delivery.deliveryId, lease.attemptNumber]
              );
              const processingRow = processing.rows[0];
              if (!processingRow) throw new StaleOutboxLeaseError();
              delivery = deliveryFromRow(processingRow);
            }

            const recipientAddress = await resolveRecipientAddress(database, job);
            if (
              !recipientAddress ||
              hashEmailRecipientAddress(recipientAddress) !== delivery.recipientAddressHash
            ) {
              return Object.freeze({
                kind: "attempt" as const,
                created,
                delivery,
                attempt,
                recipientAddress: ""
              });
            }

            return Object.freeze({
              kind: "attempt" as const,
              created,
              delivery,
              attempt,
              recipientAddress
            });
          }

          async finalizeAttemptInTransaction('''
          repository, count = begin_pattern.subn(begin_replacement, repository, count=1)
          if count != 1:
              raise SystemExit(f"repository begin replacement count={count}")
          repository_path.write_text(repository)

          handler_path = Path("src/lib/email-delivery/email-delivery-handler.ts")
          handler = handler_path.read_text()
          old_prepared = '''  const prepared = await database.transaction(async (transaction) => {
            const attempt = await repository.beginAttemptInTransaction(
              transaction,
              job,
              lease,
              adapter.key
            );
            if (attempt.attempt.outcome === "running") {
              await appendDeliveryAudit({
                database: transaction,
                job,
                action: "email.delivery.attempt.started",
                outcome: "succeeded",
                deliveryId: attempt.delivery.deliveryId,
                attemptNumber: lease.attemptNumber,
                adapterKey: adapter.key
              });
            }
            return attempt;
          });

          const alreadyFinal = storedAttemptResult(prepared.attempt);
          if (alreadyFinal) return alreadyFinal;'''
          new_prepared = '''  const preparation = await database.transaction(async (transaction) => {
            const attempt = await repository.beginAttemptInTransaction(
              transaction,
              job,
              lease,
              adapter.key
            );
            if (attempt.kind === "attempt" && attempt.created) {
              await appendDeliveryAudit({
                database: transaction,
                job,
                action: "email.delivery.attempt.started",
                outcome: "succeeded",
                deliveryId: attempt.delivery.deliveryId,
                attemptNumber: lease.attemptNumber,
                adapterKey: adapter.key
              });
            }
            return attempt;
          });

          if (preparation.kind === "already_delivered") {
            return Object.freeze({ kind: "succeeded" as const });
          }
          if (preparation.kind === "already_terminal") {
            return Object.freeze({
              kind: "terminal" as const,
              failure: normalizeOutboxFailure({
                code: preparation.delivery.lastResultCode ?? "email_terminal_failed",
                summary: preparation.delivery.lastResultSummary
                  ?? "The email delivery already reached terminal failure."
              })
            });
          }

          const prepared = preparation;
          const alreadyFinal = storedAttemptResult(prepared.attempt);
          if (alreadyFinal) return alreadyFinal;'''
          if old_prepared not in handler:
              raise SystemExit("handler preparation block not found")
          handler_path.write_text(handler.replace(old_prepared, new_prepared, 1))

          checker_path = Path("scripts/check-email-delivery-foundation.mjs")
          checker = checker_path.read_text()
          checker_anchor = '''assert.match(handler, /finalizeAttemptInTransaction/);
          assert.match(handler, /assertTrustedOutboxLease/);'''
          checker_replacement = '''assert.match(handler, /finalizeAttemptInTransaction/);
          assert.match(handler, /attempt\.kind === "attempt" && attempt\.created/);
          assert.match(handler, /preparation\.kind === "already_delivered"/);
          assert.match(handler, /preparation\.kind === "already_terminal"/);
          assert.match(repository, /const created = Boolean\(inserted\.rows\[0\]\)/);
          assert.match(repository, /kind: "already_delivered"/);
          assert.match(repository, /kind: "already_terminal"/);
          assert.match(handler, /assertTrustedOutboxLease/);'''
          if checker_anchor not in checker:
              raise SystemExit("checker anchor not found")
          checker_path.write_text(checker.replace(checker_anchor, checker_replacement, 1))

          test_path = Path("tests/platform/email-delivery-foundation.test.mjs")
          tests = test_path.read_text()
          delivered_anchor = '''    assert.equal(delivered.rows[0].terminal_failed_at, null);

            await assert.rejects('''
          delivered_replacement = '''    assert.equal(delivered.rows[0].terminal_failed_at, null);

            const duplicateStart = await database.query(sql.insertAttempt, [
              opaque("email_attempt", "Q"),
              jobId,
              lease.attemptId,
              1,
              lease.workerId,
              lease.leaseId,
              "local_test",
              hash("d")
            ]);
            assert.equal(duplicateStart.rows.length, 0);

            await database.query(
              `UPDATE platform_outbox_job_attempts
               SET outcome = 'lease_expired', finished_at = CURRENT_TIMESTAMP
               WHERE attempt_id = $1`,
              [lease.attemptId]
            );
            const postDeliveryLease = await leaseJob(database, {
              character: "R",
              jobId,
              attemptNumber: 2,
              workerCharacter: "Y",
              leaseCharacter: "Z"
            });
            const postDeliveryAttempt = await database.query(sql.insertAttempt, [
              opaque("email_attempt", "R"),
              jobId,
              postDeliveryLease.attemptId,
              2,
              postDeliveryLease.workerId,
              postDeliveryLease.leaseId,
              "local_test",
              hash("r")
            ]);
            assert.equal(postDeliveryAttempt.rows.length, 0);
            const attemptCount = await database.query(
              `SELECT COUNT(*)::int AS count
               FROM platform_email_delivery_attempts
               WHERE delivery_id = $1`,
              [queued.rows[0].delivery_id]
            );
            assert.equal(Number(attemptCount.rows[0].count), 1);

            await assert.rejects('''
          if delivered_anchor not in tests:
              raise SystemExit("email delivered test anchor not found")
          test_path.write_text(tests.replace(delivered_anchor, delivered_replacement, 1))

          register_path = Path("docs/engineering/REGRESSION-REGISTER.md")
          register = register_path.read_text().rstrip() + "\n"
          additions = '''| REG-029 | Re-entering an already-created live email attempt duplicates its immutable `attempt.started` audit fact | M1.05 email delivery | Handler treated every running attempt projection as newly created | Repository exposes whether the exact attempt row was newly created; start audit is appended only for a newly-created attempt | `check-email-delivery-foundation.mjs`; `email-delivery-foundation.test.mjs`; unique source outbox attempt | None | PROTECTED |
          | REG-030 | A reclaimed outbox job dispatches an email again after the email was already durably delivered or terminally failed before central outbox completion | M1.05 email delivery | Handler did not short-circuit persisted terminal delivery state on a later reclaimed lease | Persisted delivered state returns outbox success without another email attempt/provider call; persisted terminal failure returns the stored terminal result; no second attempt row is created | `check-email-delivery-foundation.mjs`; `email-delivery-foundation.test.mjs`; repository terminal-state preparation contract | None | PROTECTED |
          '''
          if "| REG-029 |" not in register:
              register += additions
          register_path.write_text(register)

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authentication-foundation.test.mjs \
            src/lib/email-delivery/email-delivery-domain.ts \
            src/lib/email-delivery/email-delivery-repository.ts \
            src/lib/email-delivery/email-delivery-handler.ts \
            scripts/check-email-delivery-foundation.mjs \
            tests/platform/email-delivery-foundation.test.mjs \
            docs/engineering/REGRESSION-REGISTER.md
          if git diff --cached --quiet; then
            echo "Subunit 4 idempotency hardening already applied."
            exit 0
          fi
          git commit -m "Harden email delivery idempotency and reclaim safety"
          git push origin HEAD:build/m1-05-email-delivery-foundation
