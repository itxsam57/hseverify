name: M2.05 fix generation fixture

on:
  push:
    branches: [feat/m2-05-randomized-assessment-forms]
    paths:
      - ".github/workflows/m2-05-fix-generation-fixture.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2-05-randomized-assessment-forms
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonicalize generation fixture framework reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/platform/randomized-assessment-form-runtime.test.mjs')
          text = path.read_text()
          old = '  const frameworkReference = `GEN-FRAME-${c}`;'
          new = '  const frameworkReference = `GEN-FRAME-${c.toUpperCase()}`;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one generation framework fixture, found {text.count(old)}; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run generation runtime after fixture repair
        run: node scripts/run-assessment-generation-runtime-tests.mjs
        continue-on-error: true
      - name: Commit fixture correction and remove one-shot workflow
        run: |
          git config user.name "hseverify-m205-bot"
          git config user.email "hseverify-m205-bot@users.noreply.github.com"
          git add tests/platform/randomized-assessment-form-runtime.test.mjs
          git rm .github/workflows/m2-05-fix-generation-fixture.yml
          git diff --cached --check
          git commit -m "test(m2.05): canonicalize generation framework fixture"
          git push origin HEAD:feat/m2-05-randomized-assessment-forms
