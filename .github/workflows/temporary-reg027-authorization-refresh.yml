name: Temporary REG-027 authorization refresh

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation

      - name: Apply future-safe authorization migration proof
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("tests/platform/authorization-tenant-foundation.test.mjs")
          text = path.read_text()

          text, count = re.subn(
              r'import \{\n  applyPendingMigrations,\n  migrationStatus,\n  rollbackLatestMigration\n\} from "\.\./\.\./scripts/lib/migrations\.mjs";',
              'import {\n  applyPendingMigrations,\n  listMigrations,\n  migrationStatus,\n  rollbackLatestMigration\n} from "../../scripts/lib/migrations.mjs";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"migration import replacement count={count}")

          status_pattern = re.compile(
              r'''    const status = await migrationStatus\(database\);\n'''
              r'''    assert\.deepEqual\(\n'''
              r'''      status\.map\(\(entry\) => \[entry\.id, entry\.applied, entry\.checksumMatches\]\),\n'''
              r'''      \[\n.*?      \]\n    \);''',
              re.S,
          )
          status_replacement = '''    const status = await migrationStatus(database);
            const expectedMigrationIds = (await listMigrations()).map(
              (migration) => migration.id
            );
            assert.deepEqual(status.map((entry) => entry.id), expectedMigrationIds);
            assert.equal(status.every((entry) => entry.applied), true);
            assert.equal(status.every((entry) => entry.checksumMatches), true);'''
          text, count = status_pattern.subn(status_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"status replacement count={count}")

          rollback_pattern = re.compile(
              r'''  try \{\n\s+const notificationRollback = await rollbackLatestMigration\(\n\s+database,\n\s+TEST_ENVIRONMENT\n\s+\);'''
          )
          rollback_replacement = '''  try {
            const migrationIds = (await listMigrations()).map(
              (migration) => migration.id
            );
            const notificationIndex = migrationIds.indexOf(
              "0009_persisted_notifications"
            );
            assert.ok(notificationIndex >= 0);
            for (const newerMigration of migrationIds
              .slice(notificationIndex + 1)
              .reverse()) {
              const newerRollback = await rollbackLatestMigration(
                database,
                TEST_ENVIRONMENT
              );
              assert.equal(newerRollback, newerMigration);
            }

            const notificationRollback = await rollbackLatestMigration(
              database,
              TEST_ENVIRONMENT
            );'''
          text, count = rollback_pattern.subn(rollback_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"rollback replacement count={count}")

          reapply_pattern = re.compile(
              r'''    const reapplied = await applyPendingMigrations\(\n'''
              r'''      database,\n'''
              r'''      TEST_ENVIRONMENT\.releaseSha\n'''
              r'''    \);\n'''
              r'''    assert\.deepEqual\(reapplied, \[\n.*?    \]\);''',
              re.S,
          )
          reapply_replacement = '''    const reapplied = await applyPendingMigrations(
              database,
              TEST_ENVIRONMENT.releaseSha
            );
            const authorizationIndex = migrationIds.indexOf(
              "0005_authorization_tenant_isolation"
            );
            assert.ok(authorizationIndex >= 0);
            assert.deepEqual(reapplied, migrationIds.slice(authorizationIndex));'''
          text, count = reapply_pattern.subn(reapply_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"reapply replacement count={count}")

          path.write_text(text)

      - name: Commit exact regression repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authorization-tenant-foundation.test.mjs
          git diff --cached --check
          git commit -m "Make authorization migration proof future-safe"
          git push origin HEAD:build/m1-05-email-delivery-foundation
