name: M2.08 branch TDD slice

on:
  push:
    branches: [feat/m2-08-answer-recovery]
    paths:
      - "database/migrations/0043_assessment_attempt_drafts.*"
      - "src/lib/assessment-attempt/**"
      - "src/app/worker/(portal)/assessments/**"
      - "src/app/worker/(portal)/available-assessments/**"
      - "src/components/worker/**"
      - "tests/helpers/**"
      - "tests/platform/assessment-attempt-draft-*.test.mjs"
      - "tests/platform/assessment-attempt-resume-*.test.mjs"
      - "tests/platform/assessment-attempt-m2-08-gate-contract.test.mjs"
      - "tests/platform/assessment-attempt-m2-08-browser-workflow-contract.test.mjs"
      - "tests/platform/assessment-attempt-ui-contract.test.mjs"
      - "tests/platform/assessment-attempt-browser-contract.test.mjs"
      - "tests/platform/assessment-attempt-action-boundary.test.mjs"
      - "tests/platform/assessment-attempt-answer-runtime.test.mjs"
      - "tests/platform/assessment-attempt-concurrency-runtime.test.mjs"
      - "scripts/check-assessment-attempt-drafts.mjs"
      - "scripts/run-assessment-attempt-tests.mjs"
      - "scripts/m2-08-browser-qa.mjs"
      - ".github/workflows/m2-08-browser.yml"
      - "package.json"
      - ".github/workflows/m2-08-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-08-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: tdd-session-secret-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: tdd-auth-pepper-with-at-least-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Task 11 real browser workflow RED
        run: node --test tests/platform/assessment-attempt-m2-08-browser-workflow-contract.test.mjs

      - name: Run permanent M2.08 contract gate
        run: npm run check:m2-08

      - name: Run permanent M2.08 targeted suite
        run: npm run test:m2-08

      - name: Run permanent M2.07 contract regression
        run: npm run check:m2-07

      - name: Run permanent M2.07 runtime regression
        run: npm run test:m2-07

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
