name: M2.08 branch TDD slice

on:
  push:
    branches: [feat/m2-08-answer-recovery]
    paths:
      - "database/migrations/0043_assessment_attempt_recovery.*"
      - "src/lib/assessment-attempt/**"
      - "src/lib/assessment-generation/**"
      - "scripts/run-assessment-attempt-recovery-tests.mjs"
      - "scripts/run-assessment-attempt-tests.mjs"
      - "tests/helpers/migration-ceiling.mjs"
      - "tests/platform/assessment-attempt-recovery-*.test.mjs"
      - "tests/platform/assessment-attempt-draft-runtime.test.mjs"
      - "tests/platform/assessment-attempt-interruption-runtime.test.mjs"
      - "tests/platform/assessment-attempt-technical-issue-runtime.test.mjs"
      - ".github/workflows/m2-08-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-08-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: tdd-session-secret-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: tdd-auth-pepper-with-at-least-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Task 1 recovery contract and rollback slice
        run: node --test tests/platform/assessment-attempt-recovery-contract.test.mjs tests/platform/assessment-attempt-recovery-rollback.test.mjs

      - name: Run Task 2 draft autosave slice
        run: node scripts/run-assessment-attempt-recovery-tests.mjs --drafts

      - name: Run Task 2 draft concurrency slice
        run: node scripts/run-assessment-attempt-recovery-tests.mjs --concurrency

      - name: Run Task 3 atomic commit slice
        run: node scripts/run-assessment-attempt-recovery-tests.mjs --commit

      - name: Run Task 4 interruption lifecycle slice
        run: node scripts/run-assessment-attempt-recovery-tests.mjs --lifecycle

      - name: Run Task 5 technical issue slice
        run: node scripts/run-assessment-attempt-recovery-tests.mjs --issues

      - name: Run M2.05 randomized-form regressions
        run: node scripts/run-assessment-generation-tests.mjs

      - name: Run M2.07 targeted regression
        run: npm run test:m2-07

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
