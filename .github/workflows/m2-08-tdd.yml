name: M2.08 branch TDD slice

on:
  push:
    branches: [feat/m2-08-answer-recovery]
    paths:
      - "database/migrations/0043_assessment_attempt_drafts.*"
      - "src/lib/assessment-attempt/**"
      - "src/app/worker/(portal)/assessments/**"
      - "src/app/worker/(portal)/available-assessments/**"
      - "src/components/worker/**"
      - "tests/helpers/**"
      - "tests/platform/assessment-attempt-draft-*.test.mjs"
      - "tests/platform/assessment-attempt-resume-*.test.mjs"
      - "tests/platform/assessment-attempt-browser-contract.test.mjs"
      - "tests/platform/assessment-attempt-answer-runtime.test.mjs"
      - "tests/platform/assessment-attempt-concurrency-runtime.test.mjs"
      - "scripts/run-assessment-attempt-tests.mjs"
      - ".github/workflows/m2-08-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-08-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: tdd-session-secret-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: tdd-auth-pepper-with-at-least-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Task 1 draft contract and rollback slice
        run: node --test tests/platform/assessment-attempt-draft-contract.test.mjs tests/platform/assessment-attempt-draft-rollback.test.mjs

      - name: Run Task 2 draft repository slice
        run: node --test tests/platform/assessment-attempt-draft-runtime.test.mjs

      - name: Run Task 2 draft concurrency slice
        run: node --test tests/platform/assessment-attempt-draft-concurrency-runtime.test.mjs

      - name: Run Task 3 draft service boundary slice
        run: node scripts/run-assessment-attempt-tests.mjs --drafts

      - name: Run Task 4 browser-safe draft contract
        run: node --test tests/platform/assessment-attempt-browser-contract.test.mjs

      - name: Run Task 4 owned draft projection runtime
        run: node scripts/run-assessment-attempt-tests.mjs --draft-view

      - name: Run M2.07 targeted regression
        run: npm run test:m2-07

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
