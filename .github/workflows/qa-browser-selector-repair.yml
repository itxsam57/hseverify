name: QA Browser Selector Repair

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - ".github/workflows/qa-browser-selector-repair.yml"

permissions:
  contents: write

jobs:
  patch-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/hard-browser-m2-02-m2-06
          fetch-depth: 0

      - name: Apply exact accessible-name selector repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hard-browser-qa.mjs')
          text = path.read_text()
          old = 'await page.getByLabel("Reference").fill("HSE-CORE");'
          new = 'await page.getByLabel("Reference", { exact: true }).fill("HSE-CORE");'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one ambiguous Reference selector, found {text.count(old)}; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/hard-browser-qa.mjs
          git diff --check

      - name: Commit selector fix and remove one-shot workflow
        run: |
          git config user.name "hseverify-qa-bot"
          git config user.email "hseverify-qa-bot@users.noreply.github.com"
          rm .github/workflows/qa-browser-selector-repair.yml
          git add scripts/hard-browser-qa.mjs .github/workflows/qa-browser-selector-repair.yml
          git diff --cached --check
          git commit -m "test(browser): use exact M2.03 Reference label"
          git push origin HEAD:qa/hard-browser-m2-02-m2-06
