name: Temporary REG-027 authorization format

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation

      - name: Normalize transformed indentation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("tests/platform/authorization-tenant-foundation.test.mjs")
          text = p.read_text()

          def indent_after_first(pattern, source):
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f"format block not found: {pattern}")
              lines = match.group(0).splitlines(keepends=True)
              fixed = lines[0] + "".join(
                  ((" " * 2) + line if line.strip() else line)
                  for line in lines[1:]
              )
              return source[:match.start()] + fixed + source[match.end():]

          text = indent_after_first(
              r'''    const status = await migrationStatus\(database\);\n.*?assert\.equal\(status\.every\(\(entry\) => entry\.checksumMatches\), true\);''',
              text,
          )
          text = indent_after_first(
              r'''  try \{\n.*?const notificationRollback = await rollbackLatestMigration\(\n    database,\n    TEST_ENVIRONMENT\n  \);''',
              text,
          )
          text = indent_after_first(
              r'''    const reapplied = await applyPendingMigrations\(\n.*?assert\.deepEqual\(reapplied, migrationIds\.slice\(authorizationIndex\)\);''',
              text,
          )

          p.write_text(text)

      - name: Commit formatting repair if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authorization-tenant-foundation.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Authorization migration regression formatting already normalized."
            exit 0
          fi
          git commit -m "Normalize authorization migration regression formatting"
          git push origin HEAD:build/m1-05-email-delivery-foundation
