name: M1.10 cross-brick FK remediation one-shot

on:
  push:
    branches:
      - build/m1-10-worker-invitations-company-codes

permissions:
  contents: write

concurrency:
  group: m1-10-cross-brick-fk-remediation-once
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Replace lower-brick FKs with table-specific database authority guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const migrationPath = 'database/migrations/0028_company_worker_invitations_codes.up.sql';
          let sql = fs.readFileSync(migrationPath, 'utf8');

          const replacements = new Map([
            ['tenant_id TEXT NOT NULL REFERENCES platform_tenants(tenant_id) ON DELETE RESTRICT,', 'tenant_id TEXT NOT NULL,'],
            ['invited_by_membership_id TEXT NOT NULL REFERENCES auth_tenant_memberships(membership_id) ON DELETE RESTRICT,', 'invited_by_membership_id TEXT NOT NULL,'],
            ['accepted_by_worker_account_id TEXT NULL REFERENCES auth_accounts(account_id) ON DELETE RESTRICT,', 'accepted_by_worker_account_id TEXT NULL,'],
            ['created_by_membership_id TEXT NOT NULL REFERENCES auth_tenant_memberships(membership_id) ON DELETE RESTRICT,', 'created_by_membership_id TEXT NOT NULL,'],
            ['worker_account_id TEXT NOT NULL REFERENCES auth_accounts(account_id) ON DELETE RESTRICT,', 'worker_account_id TEXT NOT NULL,'],
            ['permanent_worker_id TEXT NULL REFERENCES worker_identity_worker_ids(permanent_worker_id) ON DELETE RESTRICT,', 'permanent_worker_id TEXT NULL,'],
            ['requested_by_membership_id TEXT NULL REFERENCES auth_tenant_memberships(membership_id) ON DELETE RESTRICT,', 'requested_by_membership_id TEXT NULL,']
          ]);
          for (const [from, to] of replacements) {
            if (!sql.includes(from)) throw new Error(`M1.10 FK patch socket changed: ${from}`);
            sql = sql.replaceAll(from, to);
          }

          for (const pattern of [
            /,\n  CONSTRAINT company_worker_invitation_site_fk[\s\S]*?ON DELETE RESTRICT,\n  CONSTRAINT company_worker_invitation_department_fk[\s\S]*?ON DELETE RESTRICT/,
            /,\n  CONSTRAINT company_registration_code_site_fk[\s\S]*?ON DELETE RESTRICT,\n  CONSTRAINT company_registration_code_department_fk[\s\S]*?ON DELETE RESTRICT/,
            /,\n  CONSTRAINT company_worker_link_site_fk[\s\S]*?ON DELETE RESTRICT,\n  CONSTRAINT company_worker_link_department_fk[\s\S]*?ON DELETE RESTRICT/
          ]) {
            if (!pattern.test(sql)) throw new Error(`M1.10 unit FK patch socket changed: ${pattern}`);
            sql = sql.replace(pattern, '');
          }

          const scopeNeedle = 'CREATE OR REPLACE FUNCTION hse_validate_company_workforce_scope()\n';
          if (!sql.includes(scopeNeedle)) throw new Error('M1.10 authority guard insertion socket changed.');
          const authorityGuards = `CREATE OR REPLACE FUNCTION hse_validate_company_worker_invitation_authority()
RETURNS TRIGGER
LANGUAGE plpgsql
AS $$
BEGIN
  IF NOT EXISTS (
    SELECT 1
    FROM platform_tenants AS tenants
    WHERE tenants.tenant_id = NEW.tenant_id
      AND tenants.tenant_type = 'company'
      AND tenants.tenant_status = 'active'
  ) THEN
    RAISE EXCEPTION 'Company workforce tenant is unavailable.' USING ERRCODE = '23514';
  END IF;

  IF NOT EXISTS (
    SELECT 1
    FROM auth_tenant_memberships AS memberships
    WHERE memberships.membership_id = NEW.invited_by_membership_id
      AND memberships.tenant_id = NEW.tenant_id
      AND memberships.portal_role = 'company'
  ) THEN
    RAISE EXCEPTION 'Company workforce membership is unavailable.' USING ERRCODE = '23514';
  END IF;

  IF NEW.accepted_by_worker_account_id IS NOT NULL AND NOT EXISTS (
    SELECT 1
    FROM auth_accounts AS accounts
    JOIN auth_account_roles AS roles
      ON roles.account_id = accounts.account_id
     AND roles.role = 'worker'
    WHERE accounts.account_id = NEW.accepted_by_worker_account_id
      AND accounts.account_status = 'active'
  ) THEN
    RAISE EXCEPTION 'Company workforce accepted Worker is unavailable.' USING ERRCODE = '23514';
  END IF;

  RETURN NEW;
END;
$$;

DROP TRIGGER IF EXISTS company_worker_invitation_authority_guard ON company_worker_invitations;
CREATE TRIGGER company_worker_invitation_authority_guard
BEFORE INSERT OR UPDATE OF tenant_id, invited_by_membership_id, accepted_by_worker_account_id
ON company_worker_invitations
FOR EACH ROW EXECUTE FUNCTION hse_validate_company_worker_invitation_authority();

CREATE OR REPLACE FUNCTION hse_validate_company_registration_code_authority()
RETURNS TRIGGER
LANGUAGE plpgsql
AS $$
BEGIN
  IF NOT EXISTS (
    SELECT 1
    FROM platform_tenants AS tenants
    WHERE tenants.tenant_id = NEW.tenant_id
      AND tenants.tenant_type = 'company'
      AND tenants.tenant_status = 'active'
  ) THEN
    RAISE EXCEPTION 'Company workforce tenant is unavailable.' USING ERRCODE = '23514';
  END IF;

  IF NOT EXISTS (
    SELECT 1
    FROM auth_tenant_memberships AS memberships
    WHERE memberships.membership_id = NEW.created_by_membership_id
      AND memberships.tenant_id = NEW.tenant_id
      AND memberships.portal_role = 'company'
  ) THEN
    RAISE EXCEPTION 'Company workforce membership is unavailable.' USING ERRCODE = '23514';
  END IF;

  RETURN NEW;
END;
$$;

DROP TRIGGER IF EXISTS company_registration_code_authority_guard ON company_registration_codes;
CREATE TRIGGER company_registration_code_authority_guard
BEFORE INSERT OR UPDATE OF tenant_id, created_by_membership_id
ON company_registration_codes
FOR EACH ROW EXECUTE FUNCTION hse_validate_company_registration_code_authority();

CREATE OR REPLACE FUNCTION hse_validate_company_worker_link_authority()
RETURNS TRIGGER
LANGUAGE plpgsql
AS $$
BEGIN
  IF NOT EXISTS (
    SELECT 1
    FROM platform_tenants AS tenants
    WHERE tenants.tenant_id = NEW.tenant_id
      AND tenants.tenant_type = 'company'
      AND tenants.tenant_status = 'active'
  ) THEN
    RAISE EXCEPTION 'Company workforce tenant is unavailable.' USING ERRCODE = '23514';
  END IF;

  IF NEW.requested_by_membership_id IS NOT NULL AND NOT EXISTS (
    SELECT 1
    FROM auth_tenant_memberships AS memberships
    WHERE memberships.membership_id = NEW.requested_by_membership_id
      AND memberships.tenant_id = NEW.tenant_id
      AND memberships.portal_role = 'company'
  ) THEN
    RAISE EXCEPTION 'Company workforce membership is unavailable.' USING ERRCODE = '23514';
  END IF;

  RETURN NEW;
END;
$$;

DROP TRIGGER IF EXISTS company_worker_link_authority_guard ON company_worker_links;
CREATE TRIGGER company_worker_link_authority_guard
BEFORE INSERT OR UPDATE OF tenant_id, requested_by_membership_id
ON company_worker_links
FOR EACH ROW EXECUTE FUNCTION hse_validate_company_worker_link_authority();

`;
          sql = sql.replace(scopeNeedle, authorityGuards + scopeNeedle);

          const forbidden = /REFERENCES\s+(?:platform_tenants|auth_accounts|auth_tenant_memberships|worker_identity_worker_ids|company_sites|company_departments)/i;
          if (forbidden.test(sql)) throw new Error('M1.10 migration still owns a hard FK into a reversible lower brick.');
          if (!sql.includes('REFERENCES company_worker_invitations') || !sql.includes('REFERENCES company_registration_codes')) {
            throw new Error('M1.10 internal link FKs were removed unexpectedly.');
          }
          fs.writeFileSync(migrationPath, sql);

          const checkerPath = 'scripts/check-company-worker-invitations.mjs';
          let checker = fs.readFileSync(checkerPath, 'utf8');
          const marker = 'requirePattern(up, /payment_responsibility[\\s\\S]{0,220}(?:company|worker)/i, paths.up, "bounded company/worker payment responsibility");';
          if (!checker.includes(marker)) throw new Error('M1.10 source checker insertion socket changed.');
          const stronger = `${marker}
requireMarker(up, "hse_validate_company_worker_invitation_authority", paths.up);
requireMarker(up, "hse_validate_company_registration_code_authority", paths.up);
requireMarker(up, "hse_validate_company_worker_link_authority", paths.up);
requireMarker(up, "hse_validate_company_workforce_scope", paths.up);
requireMarker(up, "hse_validate_company_worker_link_identity", paths.up);
forbidPattern(
  up,
  /REFERENCES\\s+(?:platform_tenants|auth_accounts|auth_tenant_memberships|worker_identity_worker_ids|company_sites|company_departments)/i,
  paths.up,
  "hard foreign key from monotonic M1.10 history into a reversible lower brick"
);`;
          checker = checker.replace(marker, stronger);
          fs.writeFileSync(checkerPath, checker);
          NODE
      - name: Verify root-cause fix
        run: |
          git diff --check
          npm run check:m1-10
          npm run test:m1-10
      - name: Commit exact migration architecture fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/0028_company_worker_invitations_codes.up.sql scripts/check-company-worker-invitations.mjs
          git commit -m 'fix: decouple monotonic M1.10 history from lower migrations'
          git push origin HEAD:build/m1-10-worker-invitations-company-codes
