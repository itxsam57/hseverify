name: M1.10 permanent gate wiring one-shot

on:
  push:
    branches:
      - build/m1-10-worker-invitations-company-codes

permissions:
  contents: write

concurrency:
  group: m1-10-permanent-gate-wiring-once
  cancel-in-progress: false

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire package aggregates and engineering ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const scripts = pkg.scripts;
          scripts['check:m1-10'] = 'node scripts/check-company-worker-invitations.mjs';
          scripts['test:m1-10'] = 'node scripts/run-company-worker-invitation-tests.mjs';

          const addAfter = (value, marker, addition) => {
            if (value.includes(addition)) return value;
            if (!value.includes(marker)) throw new Error(`Package aggregate marker changed: ${marker}`);
            return value.replace(marker, `${marker} && ${addition}`);
          };
          scripts['verify:quick'] = addAfter(scripts['verify:quick'], 'npm run check:m1-09', 'npm run check:m1-10');
          scripts['test:integration'] = addAfter(scripts['test:integration'], 'npm run test:m1-09', 'npm run test:m1-10');
          scripts.check = addAfter(scripts.check, 'npm run check:m1-09', 'npm run check:m1-10');
          scripts.check = addAfter(scripts.check, 'npm run test:m1-09', 'npm run test:m1-10');
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const checkerPath = 'scripts/check-engineering-automation.mjs';
          let checker = fs.readFileSync(checkerPath, 'utf8');
          checker = checker.replace(
            '  "scripts/check-company-organization-team.mjs",\n  "tests/engineering/handoff-domain.test.mjs",',
            '  "scripts/check-company-organization-team.mjs",\n  "scripts/check-company-worker-invitations.mjs",\n  "scripts/run-company-worker-invitation-tests.mjs",\n  "tests/engineering/handoff-domain.test.mjs",'
          );
          checker = checker.replace(
            '  "tests/platform/company-organization-team.test.mjs"\n];',
            '  "tests/platform/company-organization-team.test.mjs",\n  "tests/platform/company-worker-invitations.test.mjs",\n  "tests/platform/company-worker-registration-binding.test.mjs",\n  "tests/platform/company-worker-login-return.test.mjs",\n  "tests/platform/company-worker-invitations-migration-stack.test.mjs"\n];'
          );
          checker = checker.replace(
            '  "check:company-verification", "test:m1-08-final", "check:m1-09", "test:m1-09", "report:handoff"',
            '  "check:company-verification", "test:m1-08-final", "check:m1-09", "test:m1-09", "check:m1-10", "test:m1-10", "report:handoff"'
          );
          checker = checker.replace(
            '  "check:worker-identity-corrections", "check:company-verification", "check:m1-09", "test:m1-06-final", "test:m1-07-final",\n  "test:m1-08-final", "test:m1-09", "typecheck", "lint", "build"',
            '  "check:worker-identity-corrections", "check:company-verification", "check:m1-09", "check:m1-10", "test:m1-06-final", "test:m1-07-final",\n  "test:m1-08-final", "test:m1-09", "test:m1-10", "typecheck", "lint", "build"'
          );
          checker = checker.replace(
            'for (const marker of ["check:engineering", "check:m1-06-final", "check:worker-identity", "check:company-verification", "check:m1-09", "typecheck", "lint"])',
            'for (const marker of ["check:engineering", "check:m1-06-final", "check:worker-identity", "check:company-verification", "check:m1-09", "check:m1-10", "typecheck", "lint"])'
          );
          if (!checker.includes('"check:m1-10"') || !checker.includes('tests/platform/company-worker-registration-binding.test.mjs')) {
            throw new Error('M1.10 engineering ownership wiring did not apply completely.');
          }
          fs.writeFileSync(checkerPath, checker);
          NODE
      - name: Verify targeted M1.10 permanent gate
        run: |
          node scripts/check-engineering-automation.mjs
          npm run check:m1-10
          npm run test:m1-10
      - name: Commit permanent gate wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/check-engineering-automation.mjs
          git commit -m 'test: wire M1.10 into permanent engineering gates'
          git push origin HEAD:build/m1-10-worker-invitations-company-codes
