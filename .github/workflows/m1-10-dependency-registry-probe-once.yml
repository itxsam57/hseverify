name: M1.10 dependency registry probe one-shot

on:
  push:
    branches:
      - build/m1-10-worker-invitations-company-codes

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Query npm registry and audit metadata
        run: |
          echo '--- nanoid 3.x available tail ---'
          npm view nanoid versions --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).filter(x=>x.startsWith("3.3."));console.log(v.slice(-10).join("\n"))})'
          echo '--- nanoid current dist-tags ---'
          npm view nanoid dist-tags --json
          echo '--- postcss 8.5.x available tail ---'
          npm view postcss versions --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).filter(x=>x.startsWith("8.5."));console.log(v.slice(-10).join("\n"))})'
          echo '--- postcss 8.5.25 nanoid dependency ---'
          npm view postcss@8.5.25 dependencies --json
