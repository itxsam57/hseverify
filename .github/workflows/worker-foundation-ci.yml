name: Platform foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate platform
        env:
          HSE_APP_ENV: test
          HSE_RELEASE_SHA: ${{ github.sha }}
          HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
          HSE_DATABASE_DRIVER: pglite
          HSE_PGLITE_DATA_DIR: memory://
          HSE_ENABLE_WORKER_DEMO_AUTH: "false"
          HSE_USE_WORKER_DEMO_DATA: "false"
        run: npm run check

      - name: Smoke test deployable preview
        env:
          HSE_APP_ENV: test
          HSE_RELEASE_SHA: ${{ github.sha }}
          HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
          HSE_DATABASE_DRIVER: pglite
          HSE_PGLITE_DATA_DIR: memory://
        run: npm run preview:smoke

      - name: Create release evidence
        env:
          HSE_RELEASE_SHA: ${{ github.sha }}
          HSE_RELEASE_ENV: preview
        run: npm run release:manifest

      - name: Upload preview and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: hseverify-preview-${{ github.sha }}
          path: |
            .preview-bundle
            release-manifest.json
            database/migrations
          if-no-files-found: error
          retention-days: 14
