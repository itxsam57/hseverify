name: Worker foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: worker-foundation-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate Worker Portal
        env:
          HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: npm run check
