name: Worker foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - build/worker-dashboard-foundation

permissions:
  contents: write

concurrency:
  group: worker-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile to build branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/build/worker-dashboard-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
          else
            git commit -m "chore: lock Worker Dashboard dependencies"
            git push
          fi

      - name: Validate Worker Portal
        env:
          HSE_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
        run: npm run check
