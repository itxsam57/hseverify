name: M2.08 server-draft TDD

on:
  push:
    branches: [feat/m2-08-server-draft-recovery]
    paths:
      - "database/migrations/0043_assessment_attempt_drafts.*"
      - "src/lib/assessment-attempt/assessment-attempt-draft-domain.ts"
      - "tests/platform/assessment-attempt-draft-*.test.mjs"
      - "scripts/run-assessment-attempt-draft-domain-tests.mjs"
      - ".github/workflows/m2-08-server-draft-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-08-server-draft-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: m2-08-draft-tdd-session-secret-more-than-thirty-two-characters
      HSE_AUTH_PEPPER: m2-08-draft-tdd-auth-pepper-more-than-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: RED — draft schema and rollback contracts
        run: >-
          node --test
          tests/platform/assessment-attempt-draft-contract.test.mjs
          tests/platform/assessment-attempt-draft-rollback.test.mjs

      - name: RED — raw draft edit-state domain behavior
        if: always()
        run: node scripts/run-assessment-attempt-draft-domain-tests.mjs

      - name: M2.07 schema and rollback regressions
        if: always()
        run: >-
          node --test
          tests/platform/assessment-attempt-contract.test.mjs
          tests/platform/assessment-attempt-rollback.test.mjs

      - name: Typecheck existing product baseline
        if: always()
        run: npm run typecheck
