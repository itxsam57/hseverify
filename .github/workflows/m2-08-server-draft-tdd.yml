name: M2.08 server-draft TDD

on:
  push:
    branches: [feat/m2-08-server-draft-recovery]
    paths:
      - "database/migrations/0043_assessment_attempt_drafts.*"
      - "src/lib/assessment-attempt/assessment-attempt-domain.ts"
      - "src/lib/assessment-attempt/assessment-attempt-draft-domain.ts"
      - "src/lib/assessment-attempt/assessment-attempt-repository.ts"
      - "src/lib/assessment-attempt/assessment-attempt-service.ts"
      - "src/lib/assessment-attempt/assessment-attempt-client-view.ts"
      - "src/app/worker/(portal)/assessments/[attemptId]/actions.ts"
      - "src/app/worker/(portal)/available-assessments/page.tsx"
      - "src/components/worker/assessment-workspace.tsx"
      - "tests/platform/assessment-attempt-draft-*.test.mjs"
      - "tests/platform/assessment-attempt-resume-*.test.mjs"
      - "tests/platform/assessment-attempt-ui-contract.test.mjs"
      - "scripts/run-assessment-attempt-tests.mjs"
      - "scripts/run-assessment-attempt-draft-domain-tests.mjs"
      - "scripts/run-assessment-attempt-draft-repository-tests.mjs"
      - ".github/workflows/m2-08-server-draft-tdd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-08-server-draft-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-1-9:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HSE_APP_ENV: test
      HSE_RELEASE_SHA: ${{ github.sha }}
      HSE_SESSION_SECRET: m2-08-draft-tdd-session-secret-more-than-thirty-two-characters
      HSE_AUTH_PEPPER: m2-08-draft-tdd-auth-pepper-more-than-thirty-two-characters
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: memory://
      HSE_ENABLE_AUTH_SANDBOX: "false"
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Task 1 — draft schema and rollback contracts
        run: >-
          node --test
          tests/platform/assessment-attempt-draft-contract.test.mjs
          tests/platform/assessment-attempt-draft-rollback.test.mjs

      - name: Task 1 — raw draft edit-state domain behavior
        run: node scripts/run-assessment-attempt-draft-domain-tests.mjs

      - name: M2.07 schema and rollback regressions
        run: >-
          node --test
          tests/platform/assessment-attempt-contract.test.mjs
          tests/platform/assessment-attempt-rollback.test.mjs

      - name: Full M2.07 assessment-attempt regressions
        run: npm run test:m2-07

      - name: M2.07 action-boundary regression
        run: node --test tests/platform/assessment-attempt-action-boundary.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Task 2 — repository CAS, idempotency, and concurrency
        run: node scripts/run-assessment-attempt-draft-repository-tests.mjs

      - name: Task 3 — service authority and stale guards
        run: node scripts/run-assessment-attempt-tests.mjs --drafts

      - name: Task 4 — owned view draft recovery and safe client projection
        run: node scripts/run-assessment-attempt-tests.mjs --draft-views

      - name: Task 5 — commit/draft atomicity and rollback
        run: node scripts/run-assessment-attempt-tests.mjs --draft-commit

      - name: Task 6 — owned in-progress resume listing
        run: node scripts/run-assessment-attempt-tests.mjs --resume

      - name: Task 7 — draft server-action boundary
        run: node --test tests/platform/assessment-attempt-draft-action-boundary.test.mjs

      - name: Task 8 — autosave state machine and persistence UX
        run: >-
          node --test
          tests/platform/assessment-attempt-draft-ui-contract.test.mjs
          tests/platform/assessment-attempt-ui-contract.test.mjs

      - name: RED — Task 9 exit and resume UI contracts
        run: >-
          node --test
          tests/platform/assessment-attempt-draft-ui-contract.test.mjs
          tests/platform/assessment-attempt-resume-ui-contract.test.mjs
          tests/platform/assessment-attempt-ui-contract.test.mjs
