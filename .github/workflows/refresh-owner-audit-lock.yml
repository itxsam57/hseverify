name: Refresh owner audit lockfile

on:
  push:
    branches: [fix/m1-01-owner-ui-and-audit]

permissions:
  contents: write

concurrency:
  group: refresh-owner-audit-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/m1-01-owner-ui-and-audit
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Refresh lockfile from explicit overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched transitive dependencies"
          git push origin HEAD:fix/m1-01-owner-ui-and-audit
