name: Auth runtime diagnostic

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - "scripts/pglite-timestamp-shape.mjs"
      - ".github/workflows/auth-runtime-diagnostic.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/pglite-timestamp-shape.mjs"
      - ".github/workflows/auth-runtime-diagnostic.yml"

permissions:
  contents: read

jobs:
  timestamp-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/pglite-timestamp-shape.mjs
