name: M1.11 attachment repository one-shot

on:
  push:
    branches:
      - build/m1-11-worker-evidence-records

permissions:
  contents: write

concurrency:
  group: m1-11-attachment-repository-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Append Worker evidence attachment repository methods
        shell: bash
        env:
          METHODS_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('src/lib/worker-evidence/worker-evidence-repository.ts')
          text = path.read_text(encoding='utf-8')
          if not text.endswith('\n}\n'):
              raise SystemExit('Worker evidence repository class no longer has the expected terminal class brace.')
          marker = '  async bindAttachment(input:'
          if marker in text:
              raise SystemExit('Attachment repository methods already exist; refusing duplicate patch.')
          methods = base64.b64decode(os.environ['METHODS_B64']).decode('utf-8')
          path.write_text(text[:-2] + '\n' + methods + '\n}\n', encoding='utf-8')
          PY
      - name: Verify M1.11 runtime and TypeScript
        run: |
          node scripts/run-worker-evidence-record-tests.mjs
          npm run typecheck
      - name: Commit exact repository extension
        shell: bash
        run: |
          test -n "$(git status --porcelain -- src/lib/worker-evidence/worker-evidence-repository.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/worker-evidence/worker-evidence-repository.ts
          git commit -m "feat: persist exact M1.11 evidence attachments"
          git push origin HEAD:build/m1-11-worker-evidence-records
