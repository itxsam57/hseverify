name: Temporary EMA-42 retrospective locator autopatch

on:
  push:
    branches:
      - feat/m2-06-assessment-catalogue-eligibility
    paths:
      - .github/workflows/zz-temp-autopatch-ema-42.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/m2-06-assessment-catalogue-eligibility
          fetch-depth: 0

      - name: Apply exact semantic locator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/hard-browser-retrospective-company-registration.mjs")
          text = path.read_text(encoding="utf-8")
          old = '    const invitationPathNode = page.locator("p").filter({ hasText: "Local test invitation path:" }).locator("strong");'
          new = '    const invitationPathNode = page.getByRole("status").filter({ hasText: "Local test invitation path:" }).locator("strong");'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one obsolete invitation-path locator, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove temporary autopatch workflow
        run: git rm .github/workflows/zz-temp-autopatch-ema-42.yml

      - name: Commit exact harness repair
        shell: bash
        run: |
          git config user.name "HSE Verify Engineering Factory"
          git config user.email "engineering-factory@users.noreply.github.com"
          git add scripts/hard-browser-retrospective-company-registration.mjs
          git commit -m "test: use semantic Company Team invitation locator [autopatch-ema-42]"
          git push origin HEAD:feat/m2-06-assessment-catalogue-eligibility
