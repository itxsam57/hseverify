name: Temporary REG-027 surgical format

on:
  push:
    branches:
      - build/m1-05-email-delivery-foundation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/m1-05-email-delivery-foundation
          fetch-depth: 0

      - name: Restore reviewed logic and fix only inserted indentation
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("tests/platform/authorization-tenant-foundation.test.mjs")
          reviewed = subprocess.check_output([
              "git", "show",
              "e26efcc58a2a78a9057fdaf8fc46c04429ff304f:tests/platform/authorization-tenant-foundation.test.mjs"
          ], text=True)
          lines = reviewed.splitlines(keepends=True)

          def locate_contains(fragment, start=0):
              for index in range(start, len(lines)):
                  if fragment in lines[index]:
                      return index
              raise SystemExit(f"marker not found: {fragment}")

          def prefix_range(start, end, spaces=2):
              prefix = " " * spaces
              for index in range(start, end + 1):
                  if lines[index].strip():
                      lines[index] = prefix + lines[index]

          first_test = locate_contains(
              'test("authorization migration creates tenant and membership security boundaries"'
          )
          status = locate_contains("    const status = await migrationStatus(database);", first_test)
          first_finally = locate_contains("  } finally {", status)
          prefix_range(status + 1, first_finally - 1)

          rollback_test = locate_contains(
              'test("authorization migration rolls back independently and reapplies cleanly"'
          )
          migration_ids = locate_contains("  const migrationIds = (await listMigrations()).map(", rollback_test)
          notification_call = locate_contains(
              "  const notificationRollback = await rollbackLatestMigration(",
              migration_ids
          )
          notification_end = notification_call
          while lines[notification_end].strip() != ");":
              notification_end += 1
          prefix_range(migration_ids, notification_end)

          reapplied = locate_contains(
              "    const reapplied = await applyPendingMigrations(",
              notification_end
          )
          reapply_end = locate_contains(
              "  assert.deepEqual(reapplied, migrationIds.slice(authorizationIndex));",
              reapplied
          )
          prefix_range(reapplied + 1, reapply_end)

          path.write_text("".join(lines))

      - name: Verify surgical diff and commit if needed
        run: |
          git diff --check -- tests/platform/authorization-tenant-foundation.test.mjs
          git diff --numstat e26efcc58a2a78a9057fdaf8fc46c04429ff304f -- tests/platform/authorization-tenant-foundation.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform/authorization-tenant-foundation.test.mjs
          if git diff --cached --quiet; then
            echo "Surgical authorization formatting already applied."
            exit 0
          fi
          git commit -m "Keep authorization migration repair surgical"
          git push origin HEAD:build/m1-05-email-delivery-foundation
