name: QA Verifier Browser Navigation Repair

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - ".github/workflows/qa-verifier-browser-navigation-repair.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-verifier-browser-navigation-repair.yml"

permissions:
  contents: write

jobs:
  patch-browser-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/hard-browser-m2-02-m2-06
          fetch-depth: 0

      - name: Apply exact visible-navigation browser repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hard-browser-qa.mjs')
          text = path.read_text()
          desktop = '    await gotoOk(page, "/verifier/review-queue", "Review queue");'
          mobile = '    await gotoOk(verifierSession.page, "/verifier/review-queue", "Review queue");'
          if text.count(desktop) != 1:
              raise SystemExit(f'Expected one desktop legacy verifier route line, found {text.count(desktop)}; refusing unsafe patch.')
          if text.count(mobile) != 1:
              raise SystemExit(f'Expected one mobile legacy verifier route line, found {text.count(mobile)}; refusing unsafe patch.')
          desktop_replacement = '''    await page.getByRole("link", { name: "Open evidence review queue" }).click();
              await page.waitForURL((url) => url.pathname === "/verifier/reviews", { timeout: 15_000 });
              await page.getByRole("heading", { name: "Evidence review queue" }).waitFor({ timeout: 15_000 });'''
          text = text.replace(desktop, desktop_replacement, 1)
          text = text.replace(mobile, '    await gotoOk(verifierSession.page, "/verifier/reviews", "Evidence review queue");', 1)
          refresh = '    assert(!page.url().includes("/login"), "Verifier queue lost the session on refresh");'
          refresh_replacement = '''    assert(!page.url().includes("/login"), "Verifier queue lost the session on refresh");
              await page.getByRole("heading", { name: "Evidence review queue" }).waitFor({ timeout: 15_000 });'''
          if text.count(refresh) != 1:
              raise SystemExit(f'Expected one verifier refresh assertion, found {text.count(refresh)}; refusing unsafe patch.')
          text = text.replace(refresh, refresh_replacement, 1)
          path.write_text(text)
          PY
          node --check scripts/hard-browser-qa.mjs
          git diff --check

      - name: Commit verified harness repair and remove one-shot workflow
        run: |
          git config user.name "hseverify-qa-bot"
          git config user.email "hseverify-qa-bot@users.noreply.github.com"
          rm .github/workflows/qa-verifier-browser-navigation-repair.yml
          git add scripts/hard-browser-qa.mjs .github/workflows/qa-verifier-browser-navigation-repair.yml
          git diff --cached --check
          git commit -m "test(browser): navigate verifier queue through visible dashboard action"
          git push origin HEAD:qa/hard-browser-m2-02-m2-06
