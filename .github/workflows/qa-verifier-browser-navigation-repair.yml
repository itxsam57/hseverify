name: QA Verifier Browser Navigation Repair

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - ".github/workflows/qa-verifier-browser-navigation-repair.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-verifier-browser-navigation-repair.yml"

permissions:
  contents: write

jobs:
  patch-browser-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/hard-browser-m2-02-m2-06
          fetch-depth: 0

      - name: Apply exact visible-navigation browser repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hard-browser-qa.mjs')
          text = path.read_text()
          old = '''  await checkpoint("M2.02 Verifier review queue renders and navigation is stable", async () => {
            const page = verifierSession.page;
            await gotoOk(page, "/verifier/review-queue", "Review queue");
            await page.reload({ waitUntil: "domcontentloaded" });
            assert(!page.url().includes("/login"), "Verifier queue lost the session on refresh");
            await page.screenshot({ path: `${artifactsDir}/m2-02-verifier-queue.png`, fullPage: true });
          });

          await checkpoint("mobile viewport has no horizontal overflow on tested portal pages", async () => {
            await verifierSession.page.setViewportSize({ width: 390, height: 844 });
            await gotoOk(verifierSession.page, "/verifier/review-queue", "Review queue");
            const overflow = await verifierSession.page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert(overflow <= 1, `Verifier queue horizontally overflows mobile viewport by ${overflow}px`);
            await verifierSession.page.screenshot({ path: `${artifactsDir}/mobile-verifier-queue.png`, fullPage: true });
          });
          '''
          new = '''  await checkpoint("M2.02 Verifier review queue renders and navigation is stable", async () => {
            const page = verifierSession.page;
            await page.getByRole("link", { name: "Open evidence review queue" }).click();
            await page.waitForURL((url) => url.pathname === "/verifier/reviews", { timeout: 15_000 });
            await page.getByRole("heading", { name: "Evidence review queue" }).waitFor({ timeout: 15_000 });
            await page.reload({ waitUntil: "domcontentloaded" });
            assert(!page.url().includes("/login"), "Verifier queue lost the session on refresh");
            await page.getByRole("heading", { name: "Evidence review queue" }).waitFor({ timeout: 15_000 });
            await page.screenshot({ path: `${artifactsDir}/m2-02-verifier-queue.png`, fullPage: true });
          });

          await checkpoint("mobile viewport has no horizontal overflow on tested portal pages", async () => {
            await verifierSession.page.setViewportSize({ width: 390, height: 844 });
            await gotoOk(verifierSession.page, "/verifier/reviews", "Evidence review queue");
            const overflow = await verifierSession.page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert(overflow <= 1, `Verifier queue horizontally overflows mobile viewport by ${overflow}px`);
            await verifierSession.page.screenshot({ path: `${artifactsDir}/mobile-verifier-queue.png`, fullPage: true });
          });
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale verifier queue browser block, found {text.count(old)}; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/hard-browser-qa.mjs
          git diff --check

      - name: Commit verified harness repair and remove one-shot workflow
        run: |
          git config user.name "hseverify-qa-bot"
          git config user.email "hseverify-qa-bot@users.noreply.github.com"
          rm .github/workflows/qa-verifier-browser-navigation-repair.yml
          git add scripts/hard-browser-qa.mjs .github/workflows/qa-verifier-browser-navigation-repair.yml
          git diff --cached --check
          git commit -m "test(browser): navigate verifier queue through visible dashboard action"
          git push origin HEAD:qa/hard-browser-m2-02-m2-06
