name: Temporary four-role mobile browser proof

on:
  push:
    paths:
      - ".github/workflows/temp-four-role-mobile-proof.yml"

permissions:
  contents: write

env:
  HSE_APP_ENV: test
  HSE_DATABASE_DRIVER: pglite
  HSE_SESSION_SECRET: mobile-proof-session-secret-2026-at-least-32-characters
  HSE_AUTH_PEPPER: mobile-proof-auth-pepper-2026-at-least-32-characters
  HSE_ENABLE_AUTH_SANDBOX: "true"
  HSE_AUTH_SANDBOX_ACCESS_KEY: mobile-proof-sandbox-key-2026
  HSE_ENABLE_WORKER_DEMO_AUTH: "false"
  HSE_USE_WORKER_DEMO_DATA: "false"
  HSE_RELEASE_SHA: mobile-proof
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2-06-assessment-catalogue-eligibility
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply exact four-role mobile browser proof
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('scripts/hard-browser-retrospective.mjs')
          worker_source = worker_path.read_text()
          worker_anchor = '  await checkpoint("Public verification uses a bounded non-enumerating projection", async () => {'
          worker_insert = "\n".join([
              '  await checkpoint("Worker mobile layout has no horizontal overflow", async () => {',
              '    assert(workerPage, "Worker page is unavailable for mobile layout proof");',
              '    const mobileErrors = trackErrors(workerPage, "worker-mobile");',
              '    await workerPage.setViewportSize({ width: 390, height: 844 });',
              '    await gotoOk(workerPage, "/worker/dashboard", "Permanent Worker ID");',
              '    const overflow = await workerPage.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);',
              '    assert(overflow <= 1, `Worker dashboard horizontally overflows mobile viewport by ${overflow}px`);',
              '    await workerPage.screenshot({ path: `${artifactsDir}/mobile-worker-dashboard.png`, fullPage: true, caret: "initial" });',
              '    await workerPage.setViewportSize({ width: 1440, height: 1000 });',
              '    assert(mobileErrors.length === 0, `Worker mobile browser errors: ${mobileErrors.join(" | ")}`);',
              '    return { viewport: "390x844", overflow };',
              '  });',
              '',
          ])
          if worker_source.count(worker_anchor) != 1:
              raise SystemExit(f'Expected one Worker mobile insertion anchor, found {worker_source.count(worker_anchor)}')
          worker_source = worker_source.replace(worker_anchor, worker_insert + worker_anchor, 1)

          public_old = "\n".join([
              'async function submitPublicIdentifier(page, identifier) {',
              '  await page.getByLabel("Worker ID or Credential ID").fill(identifier);',
              '  await page.getByRole("button", { name: "Verify", exact: true }).click();',
          ])
          public_new = "\n".join([
              'async function submitPublicIdentifier(page, identifier) {',
              '  await page.waitForLoadState("load");',
              '  const input = page.getByLabel("Worker ID or Credential ID");',
              '  const verifyButton = page.getByRole("button", { name: "Verify", exact: true });',
              '  await input.fill(identifier);',
              '  assert((await input.inputValue()) === identifier, "Public verification input did not retain the entered identifier.");',
              '  await verifyButton.click();',
          ])
          if worker_source.count(public_old) != 1:
              raise SystemExit(f'Expected one Public Verification submit helper, found {worker_source.count(public_old)}')
          worker_path.write_text(worker_source.replace(public_old, public_new, 1))

          company_path = Path('scripts/hard-browser-retrospective-company-registration.mjs')
          company_source = company_path.read_text()
          company_anchor = '  await checkpoint("Company sites departments and team workflow", async () => {'
          company_insert = "\n".join([
              '  await checkpoint("Company mobile layout has no horizontal overflow", async () => {',
              '    await page.setViewportSize({ width: 390, height: 844 });',
              '    await gotoOk(page, "/company/dashboard");',
              '    const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);',
              '    assert(overflow <= 1, `Company dashboard horizontally overflows mobile viewport by ${overflow}px`);',
              '    await page.screenshot({ path: `${artifactsDir}/mobile-company-dashboard.png`, fullPage: true, caret: "initial" });',
              '    await page.setViewportSize({ width: 1440, height: 1000 });',
              '    return { viewport: "390x844", overflow };',
              '  });',
              '',
              '  await checkpoint("Admin mobile layout has no horizontal overflow", async () => {',
              '    assert(adminSession, "Admin session is unavailable for mobile layout proof");',
              '    const adminPage = adminSession.page;',
              '    await adminPage.setViewportSize({ width: 390, height: 844 });',
              '    await gotoOk(adminPage, "/admin/company-verifications", "Company verification review");',
              '    const overflow = await adminPage.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);',
              '    assert(overflow <= 1, `Admin Company verification page horizontally overflows mobile viewport by ${overflow}px`);',
              '    await adminPage.screenshot({ path: `${artifactsDir}/mobile-admin-company-verifications.png`, fullPage: true, caret: "initial" });',
              '    await adminPage.setViewportSize({ width: 1440, height: 1000 });',
              '    assert(adminSession.errors.length === 0, `Admin mobile browser errors: ${adminSession.errors.join(" | ")}`);',
              '    return { viewport: "390x844", overflow };',
              '  });',
              '',
          ])
          if company_source.count(company_anchor) != 1:
              raise SystemExit(f'Expected one Company/Admin mobile insertion anchor, found {company_source.count(company_anchor)}')
          company_path.write_text(company_source.replace(company_anchor, company_insert + company_anchor, 1))

          verifier_path = Path('scripts/hard-browser-qa.mjs')
          verifier_source = verifier_path.read_text()
          verifier_old = '  await checkpoint("mobile viewport has no horizontal overflow on tested portal pages", async () => {'
          verifier_new = '  await checkpoint("Verifier mobile layout has no horizontal overflow", async () => {'
          if verifier_source.count(verifier_old) != 1:
              raise SystemExit(f'Expected one Verifier mobile checkpoint, found {verifier_source.count(verifier_old)}')
          verifier_path.write_text(verifier_source.replace(verifier_old, verifier_new, 1))

          Path('.github/workflows/temp-four-role-mobile-proof.yml').unlink()
          PY
          git diff --check
          node --check scripts/hard-browser-qa.mjs
          node --check scripts/hard-browser-retrospective.mjs
          node --check scripts/hard-browser-retrospective-company-registration.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove coverage contract GREEN after implementation
        run: node --test tests/platform/hard-browser-audit-contract.test.mjs

      - name: Install pinned Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run standalone Hard Browser QA on clean database
        run: |
          export HSE_PGLITE_DATA_DIR=/tmp/hseverify-mobile-hard-browser-db
          export HSE_BROWSER_BASE_URL=http://127.0.0.1:3000
          rm -rf "$HSE_PGLITE_DATA_DIR"
          npm run db:migrate
          node scripts/hard-browser-zero-state.mjs
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/hse-mobile-hard-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "$HSE_BROWSER_BASE_URL/"; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/hse-mobile-hard-browser-server.log
              exit 1
            fi
            sleep 1
          done
          node scripts/hard-browser-qa.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Run full retrospective Chromium proof on clean database
        run: |
          export HSE_PGLITE_DATA_DIR=/tmp/hseverify-mobile-retrospective-db
          export HSE_BROWSER_BASE_URL=http://127.0.0.1:3001
          rm -rf "$HSE_PGLITE_DATA_DIR"
          npm run db:migrate
          node scripts/hard-browser-zero-state.mjs
          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/hse-mobile-retrospective-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "$HSE_BROWSER_BASE_URL/"; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/hse-mobile-retrospective-server.log
              exit 1
            fi
            sleep 1
          done
          node scripts/hard-browser-retrospective.mjs
          node scripts/hard-browser-retrospective-worker-evidence.mjs
          node scripts/hard-browser-retrospective-company-registration.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Typecheck lint and diff verification
        run: |
          npm run typecheck
          npm run lint
          git diff --check

      - name: Commit only after every proof passes
        run: |
          git config user.name "hseverify-verification-bot"
          git config user.email "hseverify-verification-bot@users.noreply.github.com"
          git add scripts/hard-browser-qa.mjs scripts/hard-browser-retrospective.mjs scripts/hard-browser-retrospective-company-registration.mjs .github/workflows/temp-four-role-mobile-proof.yml
          git commit -m "test: prove responsive layouts across four roles"
          git push origin HEAD:feat/m2-06-assessment-catalogue-eligibility
